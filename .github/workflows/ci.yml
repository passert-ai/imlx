name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . pytest
      - run: pytest tests/ -q
      - name: trace determinism across fresh processes
        run: |
          imlx run tests/conformance/px140-brief.imlx --decls tests/conformance/catalog-decls.imlx --trace /tmp/t1.imlx
          imlx run tests/conformance/px140-brief.imlx --decls tests/conformance/catalog-decls.imlx --trace /tmp/t2.imlx
          cmp /tmp/t1.imlx /tmp/t2.imlx
          cmp /tmp/t1.imlx tests/conformance/px140-brief.trace.imlx
      - name: the trace gates itself
        run: imlx gate /tmp/t1.imlx

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
